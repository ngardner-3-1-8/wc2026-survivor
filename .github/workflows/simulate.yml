name: Simulate & Deploy

on:
  # Run daily at 06:00 UTC (2am ET) — well before anyone checks morning picks
  schedule:
    - cron: "0 6 * * *"

  # Allow manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      sims:
        description: "Number of simulations"
        required: false
        default: "50000"

  # Also re-deploy when simulator code changes
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "web/src/**"
      - ".github/workflows/**"

jobs:
  # ─────────────────────────────────────────
  # Job 1: Run the Python simulation
  # ─────────────────────────────────────────
  simulate:
    name: Run Monte Carlo Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: simulator/requirements.txt

      - name: Install Python dependencies
        run: pip install -r simulator/requirements.txt

      - name: Run simulation & export JSON
        run: |
          cd simulator
          python export_json.py \
            --sims ${{ github.event.inputs.sims || '50000' }} \
            --out-dir ../public/data

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update simulation data [skip ci]"
          file_pattern: "public/data/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # ─────────────────────────────────────────
  # Job 2: Build & deploy the React app
  # Runs after simulate (or independently on web-only changes)
  # ─────────────────────────────────────────
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: simulate   # wait for fresh JSON before building

    # Required for GitHub Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch the latest commit (including the JSON just committed above)
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: web

      - name: Copy simulation data into web build
        run: |
          mkdir -p web/public/data
          cp public/data/*.json web/public/data/

      - name: Build React app
        run: npm run build
        working-directory: web
        env:
          # Vite base path must match your GitHub Pages repo name
          # e.g. if your repo is github.com/yourname/wc2026-survivor
          # set this to /wc2026-survivor/
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
