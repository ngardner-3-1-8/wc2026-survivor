name: Simulate & Deploy

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      sims:
        description: "Number of simulations"
        required: false
        default: "50000"

  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "web/src/**"
      - ".github/workflows/**"

jobs:
  simulate:
    name: Simulate & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: simulator/requirements.txt

      - name: Install Python dependencies
        run: pip install -r simulator/requirements.txt

      # NOTE: FBref blocks GitHub Actions IPs (datacenter ranges).
      # To update ratings, run fbref_scraper.py locally on your Mac,
      # then push the updated wc2026_simulator.py to trigger a new deploy.
      - name: Run simulation & export JSON
        run: |
          cd simulator
          python export_json.py \
            --sims ${{ github.event.inputs.sims || '50000' }} \
            --out-dir ../public/data

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update simulation data [skip ci]"
          file_pattern: "public/data/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: web

      - name: Copy simulation data into web build
        run: |
          mkdir -p web/public/data
          cp public/data/*.json web/public/data/

      - name: Build React app
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
