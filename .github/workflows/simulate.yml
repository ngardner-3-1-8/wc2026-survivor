name: Simulate & Deploy

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily

  workflow_dispatch:
    inputs:
      sims:
        description: "Number of simulations"
        required: false
        default: "50000"
      skip_scrape:
        description: "Skip FBref scrape (use existing ratings)"
        required: false
        default: "false"

  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "web/src/**"
      - ".github/workflows/**"

jobs:
  simulate:
    name: Scrape, Simulate & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: simulator/requirements.txt

      - name: Install Python dependencies
        run: pip install -r simulator/requirements.txt

      # ── Step 1: Scrape FBref for live ratings ──────────────────────────────
      # continue-on-error: true means if FBref is down or blocks the runner,
      # the simulation still runs with the existing hardcoded ratings.
      # The scraper patches wc2026_simulator.py in-place with fresh att/defe values.
      - name: Scrape FBref ratings
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        run: |
          cd simulator
          python fbref_scraper.py \
            --simulator wc2026_simulator.py \
            --cache-dir /tmp/fbref_cache
        continue-on-error: true

      # ── Step 2: Run simulation & export JSON ───────────────────────────────
      - name: Run simulation & export JSON
        run: |
          cd simulator
          python export_json.py \
            --sims ${{ github.event.inputs.sims || '50000' }} \
            --out-dir ../public/data

      # ── Step 3: Commit updated JSON back to repo ───────────────────────────
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update simulation data [skip ci]"
          file_pattern: "public/data/*.json simulator/wc2026_simulator.py"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # ── Step 4: Build React app ────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: web

      - name: Copy simulation data into web build
        run: |
          mkdir -p web/public/data
          cp public/data/*.json web/public/data/

      - name: Build React app
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      # ── Step 5: Deploy to GitHub Pages ─────────────────────────────────────
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
